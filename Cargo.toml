[package]
name = "amae"
version = "0.10.5"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tar = "0.4"
flate2 = "1.0"
bincode = "1.3"
sha-1 = "0.10"
sha2 = "0.10"
futures-util = "0.3"
directories = "5.0"
tempfile = "3.8"
indicatif = "0.17"
console = "0.15"
clap_complete = "4.4"
rayon = "1.8"
memmap2 = "0.9"
fd-lock = "4.0"
base64 = "0.21"

# Scripting & Runtimes
mlua = { version = "0.9", features = ["lua54", "vendored"] }
deno_core = "0.298"
oxc_allocator = "0.13"
oxc_parser = "0.13"
oxc_span = "0.13"
oxc_transformer = "0.13"
oxc_codegen = "0.13"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
